name: Repository checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      exercise_failure:
        description: Exercise the disposable final-gate failure probe.
        required: false
        default: false
        type: boolean

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repository-checks:
    name: Repository baseline checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate required baseline paths
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            ".github"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/ep1.yml"
            ".github/ISSUE_TEMPLATE/ep2.yml"
            ".github/ISSUE_TEMPLATE/final.yml"
            ".github/workflows/repository-checks.yml"
          )

          for path in "${required_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "Missing required baseline path: $path" >&2
              exit 1
            fi
          done

      - name: Parse GitHub YAML files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' yaml_files < <(find .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)
          if [[ "${#yaml_files[@]}" -eq 0 ]]; then
            echo "No YAML files found under .github" >&2
            exit 1
          fi
          ruby -rpsych -e 'ARGV.each { |path| Psych.parse_file(path); puts "Valid YAML: #{path}" }' "${yaml_files[@]}"

      - name: Reject tracked sensitive filenames
        shell: bash
        run: |
          set -euo pipefail
          sensitive_files="$(git ls-files | grep -E '(^|/)(\.env($|\.)|[^/]+\.(pem|key|p12|pfx|crt|cer))$' | grep -Ev '(^|/)\.env\.(example|sample|template)$' || true)"
          if [[ -n "$sensitive_files" ]]; then
            echo "Tracked sensitive filenames are not allowed:" >&2
            echo "$sensitive_files" >&2
            exit 1
          fi

  manifest-discovery:
    name: CI manifest discovery
    needs: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.discovery.outputs.frontend }}
      backend: ${{ steps.discovery.outputs.backend }}
      intelligence: ${{ steps.discovery.outputs.intelligence }}
      compose: ${{ steps.discovery.outputs.compose }}
      postgres: ${{ steps.discovery.outputs.postgres }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discovery
        name: Record manifest applicability
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ci-contract.sh discover "$GITHUB_WORKSPACE" discovery.env
          cat discovery.env >> "$GITHUB_OUTPUT"
          sed "s/^/CI manifest state: /" discovery.env
          {
            echo "## CI manifest discovery"
            echo "Commit: \`$GITHUB_SHA\` | Run: \`$GITHUB_RUN_ID\`"
            sed "s/^/- /" discovery.env
          } >> "$GITHUB_STEP_SUMMARY"

  policy-probe:
    name: CI policy probe
    needs: repository-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Exercise controlled failure only on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.exercise_failure }}
        shell: bash
        run: |
          echo "Controlled failure probe requested; CI critical gate must fail." >&2
          exit 1
      - name: Confirm normal policy probe
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.exercise_failure) }}
        shell: bash
        run: echo "Policy probe passed without a manual failure request."

  ci-security:
    name: CI security
    needs: manifest-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history for secret scanning
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate security exception and environment contracts
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/security-policy.sh validate-exceptions .github/security-exceptions.yml
          bash .github/scripts/security-policy.sh validate-env-schema .env.example
      - name: Scan for secrets without exception or report uploads
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: false
      - name: Warn on MEDIUM and LOW dependency findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: LOW,MEDIUM
          exit-code: '0'
          cache: false
      - name: Block HIGH and CRITICAL dependency findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          cache: false
      - name: Write redacted security evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "policy=HIGH_CRITICAL_block_MEDIUM_LOW_warn_secrets_block"
            echo "reports=redacted_summary_only"
          } > ci-evidence/security-summary.env
          bash .github/scripts/security-policy.sh validate-artifact ci-evidence
      - name: Upload redacted security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ github.sha }}-${{ github.run_id }}-security
          path: ci-evidence/security-summary.env
          if-no-files-found: error
          retention-days: 30

  ci-codeql:
    name: CI CodeQL
    needs: manifest-discovery
    if: >-
      ${{ (needs.manifest-discovery.outputs.frontend == 'applicable' || needs.manifest-discovery.outputs.backend == 'applicable' || needs.manifest-discovery.outputs.intelligence == 'applicable') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript, python
          build-mode: none
      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

  ci-critical-gate:
    name: CI critical gate
    if: ${{ always() }}
    needs:
      - repository-checks
      - manifest-discovery
      - policy-probe
      - ci-security
      - ci-codeql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Evaluate fail-closed CI contract
        env:
          GATE_ROWS: >-
            baseline:applicable:${{ needs.repository-checks.result }};
            discovery:applicable:${{ needs.manifest-discovery.result }};
            policy-probe:applicable:${{ needs.policy-probe.result }};
            security:applicable:${{ needs.ci-security.result }};
            codeql:${{ (needs.manifest-discovery.outputs.frontend == 'applicable' || needs.manifest-discovery.outputs.backend == 'applicable' || needs.manifest-discovery.outputs.intelligence == 'applicable') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'applicable' || 'not_applicable' }}:${{ needs.ci-codeql.result }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/ci-contract.sh gate "$GATE_ROWS" gate-summary.env
          sed "s/^/CI gate result: /" gate-summary.env
          {
            echo "## CI critical gate"
            echo "Commit: \`$GITHUB_SHA\` | Run: \`$GITHUB_RUN_ID\`"
            sed "s/^/- /" gate-summary.env
          } >> "$GITHUB_STEP_SUMMARY"

name: "Entrega final — Cierre y calidad"
description: "Proponé trabajo, correcciones o mejoras necesarias para la entrega final de StockAware."
title: "[FINAL]: "
labels:
  - "phase:final"
  - "status:planned"
body:
  - type: markdown
    attributes:
      value: |
        Usá este formulario para trabajo que impacte el cierre del proyecto. Priorizá información comprobable y riesgos conocidos.
  - type: textarea
    id: objective_context
    attributes:
      label: Objetivo y contexto
      description: Explicá la necesidad, su impacto en la entrega final y el contexto actual.
      placeholder: Problema, objetivo, prioridad e impacto esperado.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Criterios de aceptación
      description: Definí los resultados verificables requeridos antes del cierre.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: scope_exclusions
    attributes:
      label: Alcance y exclusiones
      description: Aclará qué se hará y qué no forma parte de este trabajo.
      placeholder: Incluye... / No incluye...
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Área afectada
      description: Seleccioná el área principal impactada.
      options:
        - Funcionalidad de negocio
        - Frontend y experiencia de usuario
        - Backend o API
        - Base de datos
        - Seguridad
        - Rendimiento y calidad
        - Documentación o entrega
        - Otra
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Evidencia y verificación
      description: Confirmá los requisitos de evidencia para cerrar el trabajo.
      options:
        - label: Definí pruebas o pasos de validación para todos los criterios de aceptación.
          required: true
        - label: Adjuntaré resultados, capturas, logs o enlaces como evidencia.
          required: true
        - label: Identifiqué riesgos, limitaciones o trabajo pendiente relevante.
          required: true
        - label: Revisé que no se expongan secretos ni datos sensibles.
          required: true
  - type: textarea
    id: evidence_details
    attributes:
      label: Detalle de evidencia esperada
      description: Indicá cómo se validará el cambio y cualquier riesgo o pendiente conocido.
      placeholder: Pruebas, resultados esperados, evidencias, riesgos y pendientes.
    validations:
      required: true

[project]
name = "intelligence-service"
version = "0.1.0"
description = "StockAware intelligence service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "mypy>=1.13.0",
    "pytest>=8.3.4",
    "ruff>=0.8.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
python-preference = "only-managed"

[tool.ruff]
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = "(^|/)\\.venv/"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

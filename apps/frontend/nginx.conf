server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular resuelve las rutas en el navegador: cualquier ruta que no sea un
  # archivo real tiene que devolver index.html, o al recargar en /f/ADM_CLIENTE
  # nginx responderia 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Text assets go compressed; the optimized bundle drops from ~1 MB to ~200 kB on the wire.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Angular resuelve las rutas en el navegador: cualquier ruta que no sea un
  # archivo real tiene que devolver index.html, o al recargar en /f/ADM_CLIENTE
  # nginx responderia 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html points to the hashed bundle of each release: never cache it.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Hashed build output (chunk-ABC123.js, styles-XYZ.css, media/*) never changes under the same name.
  location ~* \.(?:js|css|woff2?|ttf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Assets keep their names between releases, so they get a short cache.
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
